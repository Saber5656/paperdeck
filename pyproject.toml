[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "paperdeck"
version = "0.1.0.dev0"
description = "Convert scholarly papers into self-contained HTML reading decks."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "click",
  "httpx",
  "pydantic>=2",
  "jinja2",
  "pypdfium2",
  "beautifulsoup4",
  "platformdirs",
]

[project.scripts]
paperdeck = "paperdeck.cli:main"

[dependency-groups]
dev = ["pytest", "pytest-cov", "ruff", "mypy", "playwright", "reportlab", "pip-licenses"]

[tool.hatch.build.targets.wheel]
packages = ["src/paperdeck"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603", "S607"]

[tool.mypy]
strict = true
files = ["src/paperdeck"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"
markers = ["playwright: browser integration tests", "pandoc: requires pandoc", "security: security acceptance"]
