name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: paperdeck-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_SYSTEM_PYTHON: "false"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: '3.11'
      - run: python -m pip install uv
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: '3.11'
      - run: python -m pip install uv
      - run: uv sync --locked
      - run: uv run mypy src/paperdeck

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: '3.11'
      - name: Install Pandoc (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes pandoc
      - name: Install Pandoc (macOS)
        if: runner.os == 'macOS'
        run: brew install pandoc
      - run: python -m pip install uv
      - run: uv sync --locked
      - run: uv run pytest -m "not playwright" --cov=paperdeck --cov-fail-under=85

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: '3.11'
      - run: python -m pip install uv
      - run: uv sync --locked
      - run: sudo apt-get update && sudo apt-get install --yes pandoc
      - run: uv run pytest tests/security/ -q

  playwright:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: '3.11'
      - run: python -m pip install uv
      - run: uv sync --locked
      - run: sudo apt-get update && sudo apt-get install --yes pandoc
      - run: uv run playwright install --with-deps chromium webkit
      - run: uv run pytest -m playwright

  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: '3.11'
      - run: python -m pip install uv
      - run: uv sync --locked
      - name: Runtime license gate
        run: |
          uv export --no-dev --format requirements-txt > /tmp/paperdeck-runtime.txt
          uv run pip-licenses --format=json > /tmp/paperdeck-licenses.json
          uv run python scripts/check_licenses.py /tmp/paperdeck-licenses.json --runtime-file /tmp/paperdeck-runtime.txt
      - name: Verify vendored checksums
        run: >-
          uv run python -c
          'from pathlib import Path; from paperdeck.render.vendor import verify_vendored;
          failures = verify_vendored(Path("src/paperdeck/render/assets/vendor/katex"));
          print("vendored checksum failures:", failures); raise SystemExit(bool(failures))'
      - name: Enforce HTTP boundary
        run: '! rg "httpx\\.(Client|AsyncClient|HTTPTransport)" src/paperdeck --glob "!netgate.py"'
      - name: Enforce offline viewer
        run: '! rg "fetch\\(|XMLHttpRequest|WebSocket" src/paperdeck/render/assets/viewer.js'
      - name: Check IR schema drift
        run: uv run pytest tests/unit/test_ir_schema_drift.py -q
      - name: Check workflow and package contracts
        run: uv run python -m pytest tests/unit/test_check_licenses.py tests/unit/test_workflow_hygiene.py tests/unit/test_wheel_contents.py -q
      - name: Check golden self-containment
        run: |
          find tests/goldens -type f -name '*.html' -print0 |
            while IFS= read -r -d '' html; do
              uv run python -m paperdeck.render.validate "$html"
            done
