# PyPI must have a manually registered Trusted Publisher for this repository and
# workflow. The protected `pypi` environment should require maintainer approval.
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: paperdeck-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classify-tag:
    runs-on: ubuntu-latest
    outputs:
      stable: ${{ steps.tag.outputs.stable }}
    steps:
      - id: tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "stable=true" >> "$GITHUB_OUTPUT"
          else
            echo "stable=false" >> "$GITHUB_OUTPUT"
            echo "Prerelease tag: dry-run; publish will be skipped."
          fi

  verify-version:
    needs: classify-tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - run: python -m pip install uv
      - run: uv sync --locked
      - name: Compare stable version components
        env:
          TAG: ${{ github.ref_name }}
        run: |
          uv run python - <<'PY'
          import os, re
          from paperdeck import __version__
          tag = os.environ["TAG"]
          tag_match = re.fullmatch(r"v(\d+\.\d+\.\d+)(?:-.+)?", tag)
          version_match = re.match(r"(\d+\.\d+\.\d+)", __version__)
          if not tag_match or not version_match or tag_match.group(1) != version_match.group(1):
              raise SystemExit(f"tag {tag} does not match package {__version__}")
          if re.fullmatch(r"v\d+\.\d+\.\d+", tag) and tag[1:] != __version__:
              raise SystemExit("Stable tags require an exact stable package version")
          print(f"tag {tag} matches package {__version__}")
          PY

  full-ci:
    needs: [classify-tag, verify-version]
    uses: ./.github/workflows/ci.yml

  build:
    needs: [classify-tag, full-ci]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - run: python -m pip install uv
      - run: uv sync --locked
      - run: uv build
      - uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: paperdeck-dist
          path: dist/

  smoke:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Install Pandoc
        run: sudo apt-get update && sudo apt-get install --yes pandoc
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: paperdeck-dist
          path: dist
      - run: python -m pip install --user pipx && python -m pipx ensurepath
      - run: pipx install dist/*.whl
      - run: paperdeck --version
      - run: paperdeck doctor --offline --json
      - name: Convert and validate a minimal document
        run: |
          cat > /tmp/paperdeck-release.tex <<'TEX'
          \documentclass{article}
          \begin{document}
          Release smoke test.
          \end{document}
          TEX
          paperdeck convert /tmp/paperdeck-release.tex --offline --output /tmp/paperdeck-release.html
          PAPERDECK_PYTHON="$(pipx environment --value PIPX_LOCAL_VENVS)/paperdeck/bin/python"
          "$PAPERDECK_PYTHON" -m paperdeck.render.validate /tmp/paperdeck-release.html

  publish:
    needs: [classify-tag, smoke]
    if: needs.classify-tag.outputs.stable == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: paperdeck-dist
          path: dist
      # Trusted Publishing obtains a short-lived OIDC credential; no PyPI token.
      - uses: pypa/gh-action-pypi-publish@ec4db0b4ddc65acdf4bff5fa45ac92d78b56bdf0
        with:
          packages-dir: dist/

  github-release:
    needs: [classify-tag, smoke, publish]
    if: needs.classify-tag.outputs.stable == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Create GitHub Release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --generate-notes --title "$TAG" --notes-file <(awk '/^## \[Unreleased\]/{f=1;next}/^## /{if(f) exit}f' CHANGELOG.md)
